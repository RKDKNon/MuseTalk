[project]
name = "lipsync"
version = "0.1.0"
description = "MuseTalk Lip-Sync - Audio-driven talking head from image"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "torchaudio>=2.4",
    "diffusers==0.30.2",
    "accelerate==0.28.0",
    "numpy<2",
    "opencv-python>=4.9.0",
    "soundfile>=0.12.1",
    "transformers>=4.39.2",
    "huggingface_hub>=0.30.0",
    "librosa>=0.11.0",
    "einops>=0.8.1",
    "omegaconf",
    "ffmpeg-python",
    "moviepy",
    "imageio[ffmpeg]",
    "requests",
    "gdown",
    "openmim",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cuda", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
